[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duration-math"
version = "0.1.0"
description = "1h30m 같은 사람이 읽기 쉬운 기간을 해석하고 합산"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kwondh0321"}]
keywords = ["cli", "python", "time"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
duration-math = "duration_math:main"

[tool.setuptools]
py-modules = ["duration_math"]

[project.urls]
Source = "https://github.com/Kwondh0321/duration-math"
Issues = "https://github.com/Kwondh0321/duration-math/issues"
